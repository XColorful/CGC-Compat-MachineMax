plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation "${customgun_maven}"

    implementation files(machine_max_local)
    implementation files(spark_core_local)
}

jar {
    archiveBaseName.set(mod_id)
    archiveVersion.set(mod_version)
    archiveClassifier.set("core")
}